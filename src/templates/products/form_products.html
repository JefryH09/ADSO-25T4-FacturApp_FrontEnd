
{% extends 'layout.html' %}

{% block content %}
<h1>New Product</h1>
      <form>
        <div class="mb-3">
          <label for="Product_name" class="form-label">Product Name</label>
          <input type="text" class="form-control" id="Product_name" aria-describedby="Product_nameHelp">
          <div id="Product_nameHelp" class="form-text">Write the product name.</div>
        </div>
        <div class="mb-3">
          <label for="Description" class="form-label">Product Description</label>
          <input type="text" class="form-control" id="name" aria-describedby="DescriptionHelp">
          <div id="DescriptionHelp" class="form-text">Write the product Description.</div>
        </div>
        <div class="mb-3">
          <label for="Category" class="form-label">Category</label>
          <select class="form-select" aria-label="Category">
            <option selected>Select the product category</option>
            <option value="1">Electronics</option>
            <option value="2">Home</option>
            <option value="3">Office</option>
          </select>
        </div>
        <div class="mb-3">
          <label for="Purchase_price" class="form-label">Purchase Price</label>
          <input type="text" class="form-control" id="Purchase_price" aria-describedby="Purchase_priceHelp" placeholder="$" >
          <div id="Purchase_priceHelp" class="form-text">Write Purchase Price.</div>
        </div>
        <div class="mb-3">
          <label for="Sale_price" class="form-label">Sale Price</label>
          <input type="text" class="form-control" id="Sale_price" aria-describedby="Sale_priceHelp" placeholder="$">
          <div id="Sale_priceHelp" class="form-text">Write Sale Price.</div>
        </div>
        <div class="mb-3">
          <label for="Stock" class="form-label">Stock</label>
          <input type="Stock" class="form-control" id="Stock" aria-describedby="StockHelp">
          <div id="StockHelp" class="form-text">Add Current Stock.</div>
        </div>
        <div class="mb-3">
          <label for="Status" class="form-label">Status</label>
          <select class="form-select" aria-label="Status">
            <option selected>Select the Status.</option>
            <option value="1">Active</option>
            <option value="2">Inactive</option>
          </select>
        </div>
        
        <button type="submit" class="btn btn-primary">Submit</button>
      </form>
{% endblock %}
