<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FacturAPP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</head>
<body>
    <div class="d-flex">
    
       <nav class="bg-dark text-white p-3" style="width: 220px; min-height: 100vh;">
        <h5 class="text-white mb-4">FacturAPP</h5>
        <ul class="navbar-nav flex-column">
            <li class="nav-item">
                <a class="nav-link text-white" href="/">Home</a>
            </li>
            <li class="nav-item dropdown">
                <a class="nav-link text-white dropdown-toggle" href="#" data-bs-toggle="dropdown">
                    Clients
                </a>
                <ul class="dropdown-menu">
                    <li><a class="dropdown-item" href="form_clients">New Client</a></li>
                    <li><a class="dropdown-item" href="list_clients">List Clients</a></li>
                </ul>
            </li>
            <li class="nav-item dropdown">
                <a class="nav-link text-white dropdown-toggle" href="#" data-bs-toggle="dropdown">
                    Products
                </a>
                <ul class="dropdown-menu">
                    <li><a class="dropdown-item" href="form_products">New Product</a></li>
                    <li><a class="dropdown-item" href="list_products">List Products</a></li>
                </ul>
            </li>
            <li class="nav-item dropdown">
                <a class="nav-link text-white dropdown-toggle" href="#" data-bs-toggle="dropdown">
                    Users
                </a>
                <ul class="dropdown-menu">
                    <li><a class="dropdown-item" href="form_users">New User</a></li>
                    <li><a class="dropdown-item" href="list_users">List Users</a></li>
                </ul>
            </li>
            <li class="nav-item dropdown">
                <a class="nav-link text-white dropdown-toggle" href="#" data-bs-toggle="dropdown">
                    Categories
                </a>
                <ul class="dropdown-menu">
                    <li><a class="dropdown-item" href="form_categories">New Category</a></li>
                    <li><a class="dropdown-item" href="list_categories">List Categories</a></li>
                </ul>
            </li>
        </ul>
    </nav>

    <div class="flex-grow-1 p-4">
        {% block content %}
        {% endblock %}
    </div>
</body>
</html>
